<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){var t='dark';try{t=localStorage.getItem('theme')||'dark';}catch(e){}document.documentElement.classList.add(t);})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Little Champs - Gamified Family Task Management</title>
    <meta name="description" content="Little Champs helps families organize household tasks playfully. Children earn points, climb leaderboards, and win rewards for completing chores. Perfect for families with kids aged 6-15." />
    <link rel="canonical" href="https://littlechamps.net/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA / iOS standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little Champs" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Fredoka:wght@700&amp;display=swap">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://littlechamps.net/" />
    <meta property="og:site_name" content="Little Champs" />
    <meta property="og:title" content="Little Champs - Gamified Family Task Management" />
    <meta property="og:description" content="Turn household chores into a fun family game! Kids earn points, compete on leaderboards, and win rewards." />
    <meta property="og:image" content="https://littlechamps.net/og-image.png" />
    <meta property="og:image:alt" content="Little Champs – die spielerische Aufgaben- und Belohnungs-App für Familien" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Little Champs - Gamified Family Task Management" />
    <meta name="twitter:description" content="Turn household chores into a fun family game! Kids earn points, compete on leaderboards, and win rewards." />
    <meta name="twitter:image" content="https://littlechamps.net/og-image.png" />
    <meta name="twitter:image:alt" content="Little Champs – die spielerische Aufgaben- und Belohnungs-App für Familien" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://littlechamps.net/#organization",
        "name": "Little Champs",
        "url": "https://littlechamps.net/",
        "logo": "https://littlechamps.net/favicon.png",
        "sameAs": [
          "https://www.instagram.com/littlechampsapp/",
          "https://apps.apple.com/de/app/little-champs-chore-rewards/id6778834955"
        ]
      }
    </script>
  </head>
  <body>
    <style>
      @keyframes lc-bootstrap-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      .lc-bootstrap-logo { width: 96px; height: 96px; object-fit: contain; animation: lc-bootstrap-pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .lc-bootstrap-logo { animation: none; }
      }
    </style>
    <div id="root">
      <div id="lc-bootstrap" role="status" aria-label="Little Champs wird geladen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#000;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center">
        <img class="lc-bootstrap-logo" src="%BASE_URL%images/little-champs-logo.webp" width="96" height="96" alt="Little Champs" fetchpriority="high" />
        <span id="lc-bootstrap-message" hidden></span>
        <span id="lc-bootstrap-details" hidden style="max-width:100%;overflow-wrap:anywhere;font-size:13px;color:#d5dfec"></span>
        <button id="lc-bootstrap-retry" type="button" hidden style="border:0;border-radius:12px;padding:12px 24px;background:#ffd264;color:#342300;font:700 16px system-ui,sans-serif">Erneut laden</button>
      </div>
    </div>
    <script>
      (function () {
        var retry = document.getElementById('lc-bootstrap-retry');
        function reloadPage(automatic) {
          var url = new URL(window.location.href);
          url.searchParams.set('lc_reload', String(Date.now()));
          if (automatic) url.searchParams.set('lc_boot_retry', '1');
          window.location.replace(url.href);
        }
        retry.onclick = function () { reloadPage(false); };
        var timer = setTimeout(function () {
          var message = document.getElementById('lc-bootstrap-message');
          if (!message || !retry) return;
          var details = document.getElementById('lc-bootstrap-details');
          if (details && details.textContent) return;
          // One automatic recovery for a stalled module graph. Keep the URL
          // marker until React starts, so a persistent failure cannot loop.
          if (!new URL(window.location.href).searchParams.has('lc_boot_retry')) {
            reloadPage(true);
            return;
          }
          message.textContent = 'Der Seitenstart dauert ungewöhnlich lange. Bitte versuche es erneut.';
          message.hidden = false;
          retry.hidden = false;
        }, 15000);
        // Stop the watchdog once React has replaced the bootstrap content.
        var observer = new MutationObserver(function () {
          if (document.getElementById('lc-bootstrap')) return;
          clearTimeout(timer);
          observer.disconnect();
          var url = new URL(window.location.href);
          if (url.searchParams.has('lc_boot_retry')) {
            url.searchParams.delete('lc_boot_retry');
            url.searchParams.delete('lc_reload');
            window.history.replaceState(window.history.state, '', url.href);
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
