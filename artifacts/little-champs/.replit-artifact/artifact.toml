kind = "web"
previewPath = "/"
title = "Little Champs"
description = "Die bestehende Little-Champs-Familienapp für Aufgaben, Belohnungen, Skins und Familienkommunikation für Eltern und Kinder."
version = "1.0.0"
id = "artifacts/little-champs"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20042

[services.development]
run = "pnpm --filter @workspace/little-champs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-champs", "run", "build" ]
serve = "static"
publicDir = "artifacts/little-champs/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20042"
BASE_PATH = "/"
